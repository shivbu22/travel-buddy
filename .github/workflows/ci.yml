name: Raahi CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raahi
          POSTGRES_PASSWORD: raahi
          POSTGRES_DB: raahi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raahi -d raahi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://raahi:raahi@localhost:5432/raahi
      AUTH_MODE: development
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace @raahi/server run db:generate
      - run: npm --workspace @raahi/server run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: RUN_DB_TESTS=1 npm test
      - run: npm run build
      - run: PGPASSWORD=raahi createdb -h localhost -U raahi raahi_test
      - run: DATABASE_URL=postgresql://raahi:raahi@localhost:5432/raahi_test npm --workspace @raahi/server run db:migrate
      - run: DATABASE_URL=postgresql://raahi:raahi@localhost:5432/raahi_test npm --workspace @raahi/server run test:e2e
